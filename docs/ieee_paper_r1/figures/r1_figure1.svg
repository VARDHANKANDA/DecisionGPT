<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" font-family="Helvetica,Arial,sans-serif"><rect width="800" height="260" fill="#fff"/><text x="300" y="24" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Figure 1  R1 evaluation architecture &amp; information boundary</text><rect x="40" y="60" width="130" height="56" fill="#c9d2f2" stroke="#3b5bdb"/><text x="105" y="80" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Scenario (System A)</text><text x="105" y="93" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">history + goal</text><rect x="190" y="60" width="130" height="56" fill="#c9d2f2" stroke="#3b5bdb"/><text x="255" y="80" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">A  Prediction only</text><rect x="340" y="60" width="130" height="56" fill="#c9d2f2" stroke="#3b5bdb"/><text x="405" y="80" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">B  + R1 research-only</text><text x="405" y="93" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Decision Simulation</text><rect x="500" y="60" width="130" height="56" fill="#c9d2f2" stroke="#3b5bdb"/><text x="565" y="80" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">C  + single agent</text><rect x="640" y="60" width="130" height="56" fill="#c9d2f2" stroke="#3b5bdb"/><text x="705" y="80" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">D  full system</text><text x="705" y="93" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">(agents+risk+optimizer)</text><path d="M170 88 l16 0" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><path d="M320 88 l16 0" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><path d="M470 88 l16 0" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><path d="M630 88 l16 0" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#222"/></marker></defs><rect x="40" y="150" width="730" height="44" fill="#f4f6fb" stroke="#8a8f98"/><text x="52" y="168" font-size="9" text-anchor="start" fill="#222" font-weight="normal">A/B/C/D may use: seeded history, goal, candidate set, and (B/C/D) the R1-DT elasticity ESTIMATED from that history.</text><text x="52" y="182" font-size="9" text-anchor="start" fill="#222" font-weight="normal">None may use: true scenario elasticity, oracle action, objective value, future outcomes, test labels.  Oracle uses full System-B ground truth (reference only).</text><rect x="40" y="210" width="730" height="30" fill="#fff" stroke="#8a8f98"/><text x="52" y="229" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Exogenous scorer = ground_truth.exogenous_objective_v1 (System B, unchanged, independent) -> normalised regret, computed AFTER selection.</text></svg>