<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" font-family="Helvetica,Arial,sans-serif"><rect width="520" height="240" fill="#fff"/><text x="260.0" y="24" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Figure 5  When D changes the action vs B: does the objective improve?</text><text x="60" y="60" font-size="10" text-anchor="start" fill="#222" font-weight="normal">D changed the action on 2336 / 4080 eligible instances</text><rect x="60" y="74" width="130.65068493150685" height="30" fill="#2f9e44" stroke="none"/><rect x="190.65068493150685" y="74" width="269.3493150684931" height="30" fill="#c0392b" stroke="none"/><rect x="460.0" y="74" width="0.5" height="30" fill="#8a8f98" stroke="none"/><rect x="60" y="121" width="10" height="10" fill="#2f9e44" stroke="none"/><text x="76" y="130" font-size="9" text-anchor="start" fill="#222" font-weight="normal">improved (D lower regret): 763 (33% of changes)</text><rect x="60" y="139" width="10" height="10" fill="#c0392b" stroke="none"/><text x="76" y="148" font-size="9" text-anchor="start" fill="#222" font-weight="normal">worsened (D higher regret): 1573 (67% of changes)</text><rect x="60" y="157" width="10" height="10" fill="#8a8f98" stroke="none"/><text x="76" y="166" font-size="9" text-anchor="start" fill="#222" font-weight="normal">no regret change: 0 (0% of changes)</text><text x="60" y="192" font-size="8" text-anchor="start" fill="#8a8f98" font-weight="normal">A changed action is NOT evidence of a better decision (pre-registered).</text></svg>