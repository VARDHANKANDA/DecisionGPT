# Continuous integration and release gate. NOT executed on a GitHub runner at the time of writing (none was available): every command below was
# run locally and the evidence is in docs/STAGING_VERIFICATION.md and docs/PRODUCTION_SECURITY_REVIEW.md. This file is the reproducible form.
#
# AGREED BLOCKERS (any of these fails the workflow, and `release-gate` fails with it):
#   * a failing backend test (SQLite or PostgreSQL), frontend type check / lint / test / production build
#   * a failing PostgreSQL-specific test (the postgres job REQUIRES a database and a psql client: nothing is skipped silently)
#   * a known vulnerability in the Python runtime or development requirements, or in the production JavaScript dependencies
#   * a CRITICAL or HIGH vulnerability WITH an available fix in an image this repository builds (backend, frontend)
#   * a secret found in the repository history, or a bandit finding of medium severity or above
#   * any failed check of the staging verification against the real container stack
# NOT blockers (reported, with a documented rationale and review trigger in docs/STAGING_VERIFICATION.md section 7): vulnerabilities with no fix yet
# in Debian packages, findings in third-party images (postgres, caddy), and advisories in development-only JavaScript tooling.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q -p no:cacheprovider

  backend-postgres:
    # The security-critical behaviour (migrations, partial indexes, append-only triggers, privileges, snapshot isolation, concurrent writers,
    # restart / schema-head checks) on the engine production uses. This is the release-validation job for PostgreSQL: it must RUN the tests.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_password_not_a_secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DECISIONGPT_PG_ADMIN_URL: postgresql+psycopg://ci_admin:ci_admin_password_not_a_secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: pip install -r backend/requirements.txt
      - name: PostgreSQL-only tests (fails if any is skipped or none are collected)
        run: |
          set -o pipefail                      # without it `| tee` would hide a failing pytest
          python -m pytest tests/postgres -q -p no:cacheprovider -rs | tee pg_only.txt
          summary=$(tail -n 1 pg_only.txt)     # pytest's final line, e.g. "33 passed, 2 warnings in 150s"
          echo "$summary" | grep -qE "[0-9]+ passed"
          if echo "$summary" | grep -qiE "skipped|failed|error"; then echo "PostgreSQL tests skipped, failed or errored: refusing to pass"; exit 1; fi
      - name: Existing security and tracking suites on PostgreSQL
        run: |
          python -m tests.pg_support provision > pg.env
          set -a; . ./pg.env; set +a
          python -m pytest tests/api tests/integration/test_tracking_concurrency.py tests/integration/test_tracking_integrity.py \
            tests/integration/test_outcome_tracking_provenance.py tests/integration/test_access_control.py \
            tests/unit/test_platform_causal_counterfactual_debate.py -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  dependency-and-secret-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - name: Python vulnerabilities - runtime requirements (the image's dependencies; full resolution)
        run: pip-audit -r backend/requirements-runtime.txt
      - name: Python vulnerabilities - full requirements including test tools (full resolution)
        run: pip-audit -r backend/requirements.txt
      - name: Python static security analysis (medium severity and above)
        run: bandit -r backend/app backend/scripts -ll -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript vulnerabilities - production dependencies (BLOCKING)
        run: npm audit --omit=dev --audit-level=low
        working-directory: frontend
      - name: "JavaScript vulnerabilities - including development tooling (REPORT ONLY: accepted risk, see docs/STAGING_VERIFICATION.md)"
        run: npm audit || true
        working-directory: frontend
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-stack:
    # Builds the real images, scans them, and exercises the real Compose stack (TLS proxy, roles, migrations, throttling, revocation, restart,
    # shutdown during writes, backup and restore into a fresh cluster).
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway credentials and the staging host name (never a real secret)
        run: |
          sh deploy/staging/make_env.sh
          echo "127.0.0.1 staging.example.test" | sudo tee -a /etc/hosts
      - name: Build the images the compose files name
        run: docker compose -f docker-compose.yml -f deploy/staging/docker-compose.staging.yml --profile tools build
      - name: "Vulnerability scan of the images WE build (BLOCKING: CRITICAL/HIGH with a fix available)"
        run: |
          for img in decisiongpt/backend:local decisiongpt/frontend:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
              --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$img"
          done
      - name: Dockerfile misconfiguration scan (BLOCKING)
        run: |
          for dir in backend frontend; do
            docker run --rm -v "$PWD":/src aquasec/trivy:latest config --severity HIGH,CRITICAL --exit-code 1 "/src/$dir"
          done
      - name: "Vulnerability scan of third-party images (REPORT ONLY: postgres, caddy)"
        run: |
          for img in postgres:15-alpine caddy:2-alpine; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --severity CRITICAL,HIGH "$img" || true
          done
      - name: Staging verification against the real stack
        run: python3 -u deploy/staging/verify_staging.py --report staging_report.json
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-verification
          path: staging_report.json
      - name: Stack logs (secrets are never logged; the verification scans for them)
        if: failure()
        run: docker compose -f docker-compose.yml -f deploy/staging/docker-compose.staging.yml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f deploy/staging/docker-compose.staging.yml --profile tools down -v --remove-orphans

  release-gate:
    # Succeeds only if every blocking job succeeded. Require THIS check in branch protection.
    runs-on: ubuntu-latest
    needs: [backend-sqlite, backend-postgres, frontend, dependency-and-secret-scans, container-stack]
    steps:
      - run: echo "all blocking checks passed"
