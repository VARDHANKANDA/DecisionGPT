# Render Blueprint for DecisionGPT Backend (Free Tier)
# Deploy by linking your repository on https://dashboard.render.com/blueprints

services:
  - type: web
    name: decisiongpt-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTH_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false  # Paste your Neon Free PostgreSQL URL (postgresql+psycopg://decisiongpt_app:...)
      - key: FRONTEND_ORIGIN
        sync: false  # Set in Render dashboard to your Vercel URL, e.g. https://your-app.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "43200"
      - key: JWT_ISSUER
        value: decisiongpt
      - key: JWT_AUDIENCE
        value: decisiongpt-api
      - key: RESEARCH_CONSOLE_ENABLED
        value: "true"
      - key: RESEARCH_CONSOLE_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false  # Optional: set in dashboard for OpenAI capabilities
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ANALYTICS_LLM_ENABLED
        value: "true"
      - key: ANALYTICS_EXPLAIN_ENABLED
        value: "true"
      # Supabase Persistent Object Storage (Free Tier)
      - key: SUPABASE_URL
        sync: false  # https://<project-ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false  # Supabase Service Role Key (secret)
      - key: SUPABASE_STORAGE_BUCKET
        value: decisiongpt-storage
