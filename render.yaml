# Render Blueprint for DecisionGPT Backend (Free Tier)
# Deploy by linking your repository on https://dashboard.render.com/blueprints

services:
  - type: web
    name: decisiongpt-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTH_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false  # Paste your Neon Free PostgreSQL URL (postgresql+psycopg://...)
      - key: FRONTEND_ORIGIN
        sync: false  # Set in Render dashboard to your Vercel URL, e.g. https://your-app.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "43200"
      - key: JWT_ISSUER
        value: decisiongpt
      - key: JWT_AUDIENCE
        value: decisiongpt-api
      - key: RESEARCH_CONSOLE_ENABLED
        value: "true"
      - key: RESEARCH_CONSOLE_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false  # Optional: set in dashboard for GPT-5 mini / AI capabilities
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ANALYTICS_LLM_ENABLED
        value: "true"
      - key: ANALYTICS_EXPLAIN_ENABLED
        value: "true"
      # Cloudflare R2 Persistent Object Storage (Free Allowance)
      - key: S3_BUCKET
        sync: false  # Cloudflare R2 bucket name
      - key: S3_ENDPOINT_URL
        sync: false  # https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false  # Cloudflare R2 Access Key ID
      - key: S3_SECRET_ACCESS_KEY
        sync: false  # Cloudflare R2 Secret Access Key
      - key: S3_REGION
        value: auto
